<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixIt Guiwan | Dashboard</title>
    <meta name="description" content="Professional infrastructure reporting dashboard for Barangay Guiwan, Zamboanga City. Aligned with SDG Goal 9.">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <i data-lucide="wrench"></i>
                </div>
                <div class="brand-name">FixIt <span style="font-size: 0.8rem; opacity: 0.5;">Guiwan</span></div>
            </div>

            <nav class="nav-group">
                <a href="#" class="nav-link active" onclick="router.navigate('home', event)" id="nav-home">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-link" onclick="router.navigate('feed', event)" id="nav-feed">
                    <i data-lucide="activity"></i>
                    <span>Community Feed</span>
                </a>
                <a href="#" class="nav-link" onclick="router.navigate('map', event)" id="nav-map">
                    <i data-lucide="map"></i>
                    <span>Explore Map</span>
                </a>
                <a href="#" class="nav-link" onclick="router.navigate('report', event)" id="nav-report">
                    <i data-lucide="plus-square"></i>
                    <span>New Report</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-link">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <div class="search-bar">
                    <i data-lucide="search" style="width: 18px; color: var(--text-dim);"></i>
                    <input type="text" placeholder="Search reports, locations...">
                </div>

                <div class="user-profile">
                    <button class="btn" style="background: transparent; border: 1px solid var(--border); padding: 0.5rem;" onclick="toggleSidebar()">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="user-info" style="text-align: right; display: none; @media (min-width: 1024px) { display: block; }">
                        <div style="font-weight: 600; font-size: 0.9rem;">Guiwan Admin</div>
                        <div style="font-size: 0.75rem; color: var(--text-dim);">SDG Ambassador</div>
                    </div>
                    <div class="avatar">GA</div>
                </div>
            </header>

            <div id="app-view" class="container">
                <!-- Dynamic content will be injected here -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js" type="module"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }
    </script>
</body>
</html>
